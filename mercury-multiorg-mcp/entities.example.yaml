# Entity registry for mercury-multiorg-mcp (EXAMPLE, fake data).
#
# Copy this file somewhere OUTSIDE the repo, edit it, and point the server at
# it with `--entities /path/to/entities.yaml` or MERCURY_ENTITIES_FILE.
# A file named `entities.yaml` is gitignored repo-wide and must not exist in
# this working copy.
#
# Each entry:
#   key          - short routing key; the `entity` argument of every tool
#                  (lowercase letters, digits, underscores; starts with a letter)
#   display_name - human label shown by `list_entities`
#   token_env    - environment variable that holds that org's READ-ONLY API token
#                  (Mercury: org switcher -> All Settings -> Tokens -> Read Only)
entities:
  - key: acme_main
    display_name: Acme Holdings (main)
    token_env: MERCURY_TOKEN_ACME_MAIN
  - key: acme_ops
    display_name: Acme Operations LLC
    token_env: MERCURY_TOKEN_ACME_OPS
